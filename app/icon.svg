<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Deep warm background badge gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#271c15" />
      <stop offset="55%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Golden badge border gradient -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.6" />
    </linearGradient>

    <!-- Warm halo glow around the flame -->
    <radialGradient id="flameGlow" cx="50%" cy="32%" r="42%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.55" />
      <stop offset="55%" stop-color="#f59e0b" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Outer flame gradient -->
    <linearGradient id="outerFlame" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="45%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Middle flame gradient -->
    <linearGradient id="innerFlame" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="70%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Illuminated candle wax gradient -->
    <linearGradient id="waxGrad" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="30%" stop-color="#fcd34d" />
      <stop offset="75%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Glass holder rim & base metallic gold -->
    <linearGradient id="goldRim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>

  <!-- Rounded Square Badge -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Radiant Halo Behind Flame -->
  <circle cx="32" cy="21" r="22" fill="url(#flameGlow)" />

  <!-- Memorial Candle Glass Holder (Outer Tumbler) -->
  <path
    d="M19.5 34.5 L44.5 34.5 L42 52.5 C41.7 54.5 40 56 38 56 L26 56 C24 56 22.3 54.5 22 52.5 Z"
    fill="#ffffff"
    fill-opacity="0.12"
    stroke="url(#goldRim)"
    stroke-width="1.8"
    stroke-linejoin="round"
  />

  <!-- Glowing Candle Wax Inside Glass -->
  <path
    d="M21.5 37 C25 38.2 28.5 36.2 32 37 C35.5 37.8 39 36.2 42.5 37 L40.4 51.8 C40.2 53.1 39.1 54 37.8 54 L26.2 54 C24.9 54 23.8 53.1 23.6 51.8 Z"
    fill="url(#waxGrad)"
  />

  <!-- Top Golden Rim of Memorial Glass -->
  <rect x="18.5" y="33.2" width="27" height="2.6" rx="1.3" fill="url(#goldRim)" />

  <!-- Subtle Star of David / Light Emblem on Candle Body -->
  <path
    d="M32 41.2 L34.8 46.2 L29.2 46.2 Z M32 47.8 L34.8 42.8 L29.2 42.8 Z"
    fill="#fffbeb"
    fill-opacity="0.38"
  />

  <!-- Candle Wick -->
  <path d="M32 30.5 L32 34.5" stroke="#451a03" stroke-width="2.2" stroke-linecap="round" />

  <!-- Outer Flame (Large, Bold for 16x16 visibility) -->
  <path
    d="M32 6.5 C32 6.5 43 16.5 43 24 C43 29.2 38.1 32.8 32 32.8 C25.9 32.8 21 29.2 21 24 C21 16.5 32 6.5 32 6.5 Z"
    fill="url(#outerFlame)"
  />

  <!-- Middle Flame -->
  <path
    d="M32 12 C32 12 39 19 39 24.5 C39 28.2 35.9 31.2 32 31.2 C28.1 31.2 25 28.2 25 24.5 C25 19 32 12 32 12 Z"
    fill="url(#innerFlame)"
  />

  <!-- Bright White-Gold Flame Heart -->
  <path
    d="M32 18.5 C32 18.5 35.6 22.5 35.6 25.8 C35.6 28.2 34 30 32 30 C30 30 28.4 28.2 28.4 25.8 C28.4 22.5 32 18.5 32 18.5 Z"
    fill="#ffffff"
  />
</svg>
